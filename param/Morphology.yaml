# Morphology.yaml
spiculation:
  hough_threshold: 30
  min_length: 10       # 单位：像素
  max_gap: 3

lobulation:
  block_size: 11
  c: 2
  contour_thresh: 0.3

vacuolation:
  min_r: 0.5
  max_r: 5
  circularity: 5.0
  contrast_thresh: 3.14

calcification:
  hu_thresh: 450
  hu_scale_factor: 2
  min_speckle: 0.785              # 单位：mm²[1](@ref)
  circularity_threshold: 0.7      # 圆形度标准[1,7](@ref)
  enhancement_thresh: 10          # 增强CT稳定性阈值[1](@ref)

physical_params:
  mm_per_pixel: 0.5               # 空间分辨率[1](@ref)
  slice_thickness: 1.0            # 层厚（单位：mm）