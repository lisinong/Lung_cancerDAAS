# 物理参数校准
mm_per_pixel: 0.5
slice_thickness: 1.0 # CT层厚

# 动态参数调整规则
adaptive_rules:
  spiculation:
    angle_range: [15,75] # 根据结节位置自动调整
    scale_factors:
      small_nodule: [1.0, 0.5]
      large_nodule: [0.75, 0.3]
  calcification:
    min_speckle: 0.785   # 直径1mm钙化点面积(0.5mm/pixel)
    enhancement_thresh: 10
    morph_kernel: 3      # 3x3结构元素