# Morphology.yaml
spiculation:
  hough_threshold: 30    # 霍夫变换阈值
  min_length: 10         # 最小线段长度
  max_gap: 3             # 最大线段间隙

lobulation:
  block_size: 11         #自适应阈值块大小
  c: 2                   #自适应阈值常数
  contour_thresh: 0.3    # 轮廓阈值

vacuolation:
  min_area: 1           # 空泡征最小面积
  max_area: 3           # 空泡征最大面积

calcification:
  min_area: 10          # 钙化征最小面积
  max_area: 150         # 钙化征最大面积


physical_params:
  mm_per_pixel: 0.5               # 空间分辨率[1](@ref)
